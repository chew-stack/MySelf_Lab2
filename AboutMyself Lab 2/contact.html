<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="contact.css">
    <link rel="preconnect" href="https://colorhunt.co">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bevan:ital@0;1&family=Fjalla+One&family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="div1">
        <h2 class="h1"><b>Contact</b></h2>
        <div class="divcontact">
            <form action="response.html">
            <table>
                <tr>
                    <td class="name"><p><b>Name:</b></p>
                    <td><input type="text" placeholder="Enter your name" required></td>
                    </td>
                </tr>
                <tr>
                    <td class="email"><p><b>Email:</b></p></td>
                    <td><input type="email" placeholder="Enter your email" required></td>
                </tr>
                <tr>
                    <td class="message"><p><b>Message:</b></p></td>
                    <td><textarea rows="5" cols="40" required></textarea></td>
                </tr>
            </table>
            <div class="button">
                <input type="reset" value="RESET">
                <input type="submit" value="SUBMIT">
            </div>
            </form>
        </div>
    </div>

</body>
</html>
